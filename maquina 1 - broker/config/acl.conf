%% SERVICIO CENTRAL (usuario "servicio")
%% Publica el estado oficial, los avisos de sala, los mensajes privados y su propia presencia.
{allow, {user, "servicio"}, publish, ["espia/sala/+/state", "espia/sala/+/events", "espia/sala/+/private/+", "espia/service/status"]}.
%% Escucha los pedidos de todos los jugadores y la presencia.
{allow, {user, "servicio"}, subscribe, ["espia/sala/+/action/+", "espia/presence/+"]}.

%% JUGADORES
%% Publican SOLO en sus propios topics: sus pedidos y su presencia (Last Will).
{allow, all, publish, ["espia/sala/+/action/${username}", "espia/presence/${username}"]}.
%% Leen el estado y los avisos de las salas, su propio topic privado y si el servicio esta vivo.
{allow, all, subscribe, ["espia/sala/+/state", "espia/sala/+/events", "espia/sala/+/private/${username}", "espia/service/status"]}.

%% TODO LO DEMAS SE NIEGA
{deny, all}.

